spring:
  application:
    name: talent-flow
  data:
    mongodb:
      uri: ${MONGODB_URI}
  mail:
    host: ${SMTP_HOST:smtp-relay.brevo.com}
    port: ${SMTP_PORT:2525}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
  s3:
    s3-bucket-access-key: ${S3_BUCKET_ACCESS_KEY:}
    s3-bucket-secret-key: ${S3_BUCKET_SECRET_KEY:}
    s3-bucket-region: ${S3_BUCKET_REGION:us-east-1}
    s3-bucket-name: ${S3_BUCKET_NAME:}

server:
  port: ${PORT:8080}
  address: 0.0.0.0
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:none}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    jwt-secret: ${JWT_SECRET}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    password-reset-expiry-hours: 2
    password-reset-frontend-url: ${PASSWORD_RESET_FRONTEND_URL}
    login-url: ${LOGIN_URL}
  seed:
    admin:
      enabled: ${ADMIN_SEED_ENABLED:false}
      email: ${ADMIN_SEED_EMAIL:}
      password: ${ADMIN_SEED_PASSWORD:}
      first-name: ${ADMIN_SEED_FIRST_NAME:System}
      last-name: ${ADMIN_SEED_LAST_NAME:Admin}
      update-password: ${ADMIN_SEED_UPDATE_PASSWORD:false}
  mail:
    from: ${EMAIL_FROM}
    from-name: ${SMTP_FROM_NAME:Talent Flow}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.talentFlow: INFO
    org.springframework.security: INFO
